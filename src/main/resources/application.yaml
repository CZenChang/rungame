spring:
  application:
    name: rungame
  threads:
    virtual:
      enabled: true

  # ─── PostgreSQL DataSource ───────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rungame}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      # 已棄用native重要：GraalVM native 下需關閉 JMX
      # mbean 是觀測套件，actuator可取代
      register-mbeans: false

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────
  jpa:
    open-in-view: false          # 關閉 OSIV，避免 native 下 proxy 問題，true 連線占用直到整個response 結束，false db 查詢用完連線就釋放
    show-sql: false
    hibernate:
      ddl-auto: validate         # 不要自動 create table
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        #  enhanced proxies，native image 友善，使用反射提升效能，但占用記憶體
        bytecode:
          use_reflection_optimizer: false
        jakarta:
          persistence:
            query:
              timeout: 5000  # 單一 query 超時 5 秒（ms）

  # ─── Flyway DB Migration ─────────────────────────────────────────────────
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── Cache Configuration ────────────────────────────────────────────────
  cache:
    type: caffeine
    cache-names: preventRepeat
    caffeine:
      spec: expireAfterWrite=2s,maximumSize=1000

  lifecycle:
    timeout-per-shutdown-phase: 10s

# ─── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ─── Logging ──────────────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.dodognoman.rungame: DEBUG
    org.hibernate.SQL: WARN

server:
  port: 8080
  servlet:
    context-path: /rungame
  tomcat:
    max-connections: 1000
    accept-count: 100   #等待隊列的最大長度，超過後會拒絕新的連接
  shutdown: graceful

# ─── JWT ──────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars!!}
  access-token-hours: 24
  refresh-token-days: 30
