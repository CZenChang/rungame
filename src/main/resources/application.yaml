spring:
  application:
    name: rungame
  threads:
    virtual:
      enabled: true

  # ─── PostgreSQL DataSource ───────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rungame}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      # 已棄用native重要：GraalVM native 下需關閉 JMX
      # mbean 是觀測套件，actuator可取代
      register-mbeans: false

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────
  jpa:
    open-in-view: false          # 關閉 OSIV，避免 native 下 proxy 問題，true 連線占用直到整個response 結束，false db 查詢用完連線就釋放
    show-sql: false
    hibernate:
      ddl-auto: validate         # 不要自動 create table
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        #  enhanced proxies，native image 友善，使用反射提升效能，但占用記憶體
        bytecode:
          use_reflection_optimizer: false
        jakarta:
          persistence:
            query:
              timeout: 5000  # 單一 query 超時 5 秒（ms）

  # ─── Flyway DB Migration ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# -- shutdown setting
  lifecycle:
    timeout-per-shutdown-phase: 10s

  # ─── gRPC Server ─────────────────────────────────────────────────────────
  # 與 HTTP（8080）分開的獨立埠；服務以 @GrpcService 自動註冊。
  grpc:
    server:
      port: ${GRPC_PORT:9090}
      # 啟用 server reflection，方便 grpcurl / Postman 等工具在無 proto 檔下探索服務
      reflection:
        enabled: true
# ─── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
#      probes:
#        enabled: true #k8s 探針
      show-details: never


# ─── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.dodognoman.rungame: INFO
    org.hibernate.SQL: WARN

server:
  port: 8080
  servlet:
    context-path: /rungame
  tomcat:
    max-connections: 100
    accept-count: 100   #等待隊列的最大長度，超過後會拒絕新的連接
  shutdown: graceful

# ─── Actuator Auth（ECDSA 公鑰驗簽）─────────────────────────────────────────
actuator:
  public-key: ${ACTUATOR_PUBLIC_KEY:REPLACE_ME_RUN_ActuatorKeyGen}

# ─── JWT ──────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars!!}
  access-token-hours: 24
