spring:
  application:
    name: rungame

  # ─── PostgreSQL DataSource ───────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rungame}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      # ✅ 重要：GraalVM native 下需關閉 JMX
      register-mbeans: false

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────
  jpa:
    open-in-view: false          # 關閉 OSIV，避免 native 下 proxy 問題
    show-sql: false
    hibernate:
      ddl-auto: validate         # Flyway 管 schema，Hibernate 只驗證
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        # ✅ 關閉 enhanced proxies，native image 友善
        bytecode:
          use_reflection_optimizer: false

  # ─── Flyway DB Migration ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ─── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ─── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.dogodnoman.rungame: DEBUG
    org.hibernate.SQL: WARN

server:
  port: 8080
